<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up — Tap &amp; Eat</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <div class="card" style="max-width:440px; margin:0 auto;">
      <h1>Create your account</h1>
      <form id="register-form" class="stack" novalidate>
        <div>
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" required />
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="8" autocomplete="new-password" />
          <div class="muted">At least 8 characters.</div>
        </div>
        <div id="form-msg" class="msg hidden"></div>
        <button type="submit" id="submit-btn">Sign up</button>
      </form>
      <p class="muted" style="margin-top:16px;">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </main>
  <script src="/js/site.js"></script>
  <script>
    const form = document.getElementById("register-form");
    const formMsg = document.getElementById("form-msg");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideMessage(formMsg);

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!fullName || !email || password.length < 8) {
        showMessage(formMsg, "Please fill in all fields; password needs at least 8 characters.", "error");
        return;
      }

      submitBtn.disabled = true;
      try {
        const result = await api("/api/auth/register", {
          method: "POST",
          auth: false,
          body: { fullName, email, password }
        });
        Auth.save(result);
        window.location.href = "/menu.html";
      } catch (err) {
        showMessage(formMsg, err.message, "error");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
