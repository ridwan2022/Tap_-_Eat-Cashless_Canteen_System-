<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu — Tap & Eat</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <div class="card">
      <h1>Today's Menu</h1>
      <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <label for="tag-filter" style="margin:0;">Filter by dietary tag</label>
        <select id="tag-filter">
          <option value="">All items</option>
        </select>
        <span class="muted" id="live-indicator">● connecting to live stock updates…</span>
      </div>
    </div>

    <div id="menu-grid" class="menu-grid"></div>
    <p id="empty-msg" class="muted hidden">No items match this filter right now.</p>
  </main>

  <script src="/js/site.js"></script>
  <script src="/js/signalr.min.js"></script>
  <script>
    const grid = document.getElementById("menu-grid");
    const tagFilter = document.getElementById("tag-filter");
    const emptyMsg = document.getElementById("empty-msg");
    const liveIndicator = document.getElementById("live-indicator");

    let items = [];

    function stockLabel(status) {
      return { Available: "In stock", Low: "Low stock", Out: "Out of stock" }[status] || status;
    }

    function renderTagOptions() {
      const tags = new Set();
      items.forEach(i => i.dietaryTags.forEach(t => tags.add(t)));
      const current = tagFilter.value;
      tagFilter.innerHTML = '<option value="">All items</option>' +
        [...tags].sort().map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");
      tagFilter.value = current;
    }

    function renderGrid() {
      const activeTag = tagFilter.value;
      const visible = activeTag
        ? items.filter(i => i.dietaryTags.some(t => t.toLowerCase() === activeTag.toLowerCase()))
        : items;

      grid.innerHTML = visible.map(item => `
        <div class="menu-item" data-id="${item.id}">
          <h3>${escapeHtml(item.name)}${item.isOverride ? ' <span class="pill tag">Today\'s Special</span>' : ""}</h3>
          <div class="muted">${escapeHtml(item.description || "")}</div>
          <div class="price">৳${Number(item.price).toFixed(2)}</div>
          <div>${item.dietaryTags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join("")}</div>
          <div class="stock-line">
            <span class="pill ${item.stockStatus.toLowerCase()}" data-role="stock-pill">${stockLabel(item.stockStatus)}</span>
            <span data-role="stock-count">${item.stockCount} left</span>
          </div>
          ${item.stockCount > 0 ? `<button class="btn-add" data-add="${item.id}">Add to cart</button>` : ""}
        </div>
      `).join("");

      emptyMsg.classList.toggle("hidden", visible.length !== 0);
    }

    // Sprint 2 — add to cart (checkout happens on /checkout.html).
    grid.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-add]");
      if (!btn) return;
      if (!Auth.user()) { window.location.href = "/login.html"; return; }
      const item = items.find(i => i.id === btn.dataset.add);
      if (!item) return;
      Cart.add(item);
      renderNav();
      btn.textContent = "Added ✓";
      setTimeout(() => { btn.textContent = "Add to cart"; }, 900);
    });

    function applyStockUpdate(update) {
      const item = items.find(i => i.id === update.menuItemId);
      if (!item) return; // item might not be in the currently loaded/published set
      item.stockCount = update.stockCount;
      item.stockStatus = update.stockStatus;

      renderGrid(); // re-render so the "Add to cart" button appears/disappears with stock
    }

    async function loadMenu() {
      items = await api("/api/menu", { auth: false });
      renderTagOptions();
      renderGrid();
    }

    tagFilter.addEventListener("change", renderGrid);

    loadMenu().catch(err => {
      grid.innerHTML = `<p class="msg error">${escapeHtml(err.message)}</p>`;
    });

    // Task 3.4 — real-time stock updates over SignalR, so the page reflects
    // changes within a few seconds without a manual refresh.
    const connection = new signalR.HubConnectionBuilder()
      .withUrl("/hubs/menu")
      .withAutomaticReconnect()
      .build();

    connection.on("StockUpdated", applyStockUpdate);

    connection.start()
      .then(() => { liveIndicator.textContent = "● live stock updates connected"; })
      .catch(() => { liveIndicator.textContent = "○ live updates unavailable (showing last-loaded stock)"; });

    connection.onreconnecting(() => { liveIndicator.textContent = "● reconnecting…"; });
    connection.onreconnected(() => { liveIndicator.textContent = "● live stock updates connected"; });
  </script>
</body>
</html>
