<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — Tap & Eat</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <div class="card" style="max-width:440px; margin:0 auto;">
      <h1>Reset your password</h1>

      <section id="step-request">
        <p class="muted">Enter your email and we'll send you a reset link/OTP.</p>
        <form id="request-form" class="stack" novalidate>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="username" />
          </div>
          <div id="request-msg" class="msg hidden"></div>
          <button type="submit" id="request-btn">Send reset code</button>
        </form>
      </section>

      <section id="step-reset" class="hidden">
        <p class="muted">
          No email/SMS gateway is wired up yet in Sprint 1, so the reset
          code is shown below for testing — in Sprint 2 this will arrive by
          email/SMS instead and won't appear on screen.
        </p>
        <div class="msg info" id="dev-token-box"></div>
        <form id="reset-form" class="stack" novalidate>
          <div>
            <label for="token">Reset code</label>
            <input type="text" id="token" required />
          </div>
          <div>
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" required minlength="8" autocomplete="new-password" />
          </div>
          <div id="reset-msg" class="msg hidden"></div>
          <button type="submit" id="reset-btn">Set new password</button>
        </form>
      </section>
    </div>
  </main>
  <script src="/js/site.js"></script>
  <script>
    const requestForm = document.getElementById("request-form");
    const requestMsg = document.getElementById("request-msg");
    const requestBtn = document.getElementById("request-btn");

    const stepRequest = document.getElementById("step-request");
    const stepReset = document.getElementById("step-reset");
    const devTokenBox = document.getElementById("dev-token-box");

    const resetForm = document.getElementById("reset-form");
    const resetMsg = document.getElementById("reset-msg");
    const resetBtn = document.getElementById("reset-btn");

    let emailForReset = "";

    requestForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideMessage(requestMsg);
      emailForReset = document.getElementById("email").value.trim();
      if (!emailForReset) {
        showMessage(requestMsg, "Email is required.", "error");
        return;
      }

      requestBtn.disabled = true;
      try {
        const result = await api("/api/auth/forgot-password", {
          method: "POST",
          auth: false,
          body: { email: emailForReset }
        });
        showMessage(requestMsg, result.message, "success");
        stepReset.classList.remove("hidden");
        if (result.devOnlyResetToken) {
          devTokenBox.textContent = "Dev-only reset code: " + result.devOnlyResetToken;
          document.getElementById("token").value = result.devOnlyResetToken;
        } else {
          devTokenBox.classList.add("hidden");
        }
      } catch (err) {
        showMessage(requestMsg, err.message, "error");
      } finally {
        requestBtn.disabled = false;
      }
    });

    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideMessage(resetMsg);
      const token = document.getElementById("token").value.trim();
      const newPassword = document.getElementById("newPassword").value;

      if (!token || newPassword.length < 8) {
        showMessage(resetMsg, "Enter the reset code and a password of at least 8 characters.", "error");
        return;
      }

      resetBtn.disabled = true;
      try {
        await api("/api/auth/reset-password", {
          method: "POST",
          auth: false,
          body: { email: emailForReset, token, newPassword }
        });
        Auth.clear();
        showMessage(resetMsg, "Password reset. Redirecting to log in…", "success");
        setTimeout(() => { window.location.href = "/login.html"; }, 1200);
      } catch (err) {
        showMessage(resetMsg, err.message, "error");
      } finally {
        resetBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
